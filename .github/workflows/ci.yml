name: Continous Integration

on: [pull_request]

jobs:

  build:
    runs-on: ubuntu-20.04

    strategy:
      matrix:
        node: [18]

    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node }}

    - name: Install Dependencies
      run: |
        yarn install --frozen-lockfile

    - name: Lint
      run: |
        yarn lint

    - name: Build
      run: |
        yarn clean && yarn build